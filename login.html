<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход дизайнера — Stella</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f1ec;
      color: #302b25;
      font: 16px Arial, sans-serif;
    }
    .card {
      width: min(420px, calc(100% - 32px));
      padding: 30px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px #0001;
    }
    h1 { margin: 0 0 10px; font-size: 26px; }
    p { line-height: 1.45; color: #71695f; }
    label {
      display: block;
      margin: 22px 0 7px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cfc7bc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #9a713e;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    .hidden { display: none; }
    .message {
      margin-top: 16px;
      padding: 11px;
      border-radius: 8px;
      background: #f5eee4;
      line-height: 1.4;
    }
    .error { background: #fbe8e6; color: #9d3028; }
    .success { background: #e8f5e9; color: #286b35; }
    .small { font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Кабинет дизайнера</h1>
    <p>Введите одобренную почту. На неё придёт одноразовый код входа.</p>

    <form id="emailForm">
      <label for="email">Электронная почта</label>
      <input id="email" type="email" autocomplete="email" required placeholder="designer@example.com">
      <button id="sendBtn" type="submit">Получить код</button>
    </form>

    <form id="codeForm" class="hidden">
      <label for="code">Код из письма</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code"
             maxlength="6" pattern="[0-9]{6}" required placeholder="123456">
      <button id="loginBtn" type="submit">Войти</button>
    </form>

    <div id="message" class="message hidden"></div>
  </main>

  <script>
    const emailForm = document.querySelector("#emailForm");
    const codeForm = document.querySelector("#codeForm");
    const emailInput = document.querySelector("#email");
    const codeInput = document.querySelector("#code");
    const sendBtn = document.querySelector("#sendBtn");
    const loginBtn = document.querySelector("#loginBtn");
    const message = document.querySelector("#message");

    function showMessage(text, type = "") {
      message.textContent = text;
      message.className = "message " + type;
    }

    emailForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      sendBtn.disabled = true;
      showMessage("Отправляем код…");

      try {
        const response = await fetch("/api/auth/request-code", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: emailInput.value.trim() })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Не удалось отправить код");
        }

        codeForm.classList.remove("hidden");
        codeInput.focus();
        showMessage(
          "Если эта почта одобрена, код отправлен на неё. Проверьте также папку «Спам».",
          "success"
        );
      } catch (error) {
        showMessage(error.message, "error");
      } finally {
        sendBtn.disabled = false;
      }
    });

    codeForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginBtn.disabled = true;
      showMessage("Проверяем код…");

      try {
        const response = await fetch("/api/auth/verify-code", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: emailInput.value.trim(),
            code: codeInput.value.trim()
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Неверный или просроченный код");
        }

        showMessage(
          "Вход выполнен. Открываем кабинет…",
          "success"
        );
        setTimeout(function(){ location.href = "/cabinet.html"; }, 900);
        emailForm.classList.add("hidden");
        codeForm.classList.add("hidden");
      } catch (error) {
        showMessage(error.message, "error");
      } finally {
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
